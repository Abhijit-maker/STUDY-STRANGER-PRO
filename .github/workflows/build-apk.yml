name: Build and Release Android Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK successfully built!"
            ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          else
            echo "APK not found!"
            find android/app/build/outputs/ -name "*.apk" || true
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare Release Asset
        id: prepare_release
        run: |
          mkdir -p /tmp/apk_release
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/apk_release/app-debug.apk
          echo "asset_path=/tmp/apk_release/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          gh release create "$TAG_NAME" /tmp/apk_release/app-debug.apk \
            --title "$RELEASE_TITLE" \
            --notes "### 📱 Study Stranger - Android Debug APK
            - **Build Number:** #${{ github.run_number }}
            - **Commit:** ${{ github.sha }}
            - **Direct Download:** [app-debug.apk](https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk)
            
            *This debug APK is generated automatically via GitHub Actions.*" \
            --latest \
            --target "${{ github.sha }}"

      - name: Report APK Result
        if: always()
        run: |
          echo "### 📱 Android APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "Direct APK Download URL: https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk" >> $GITHUB_STEP_SUMMARY
