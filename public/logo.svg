<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Soft brutalist drop shadow -->
    <filter id="logoShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="3" dy="3.5" stdDeviation="0" flood-color="#18181B" flood-opacity="1" />
    </filter>
    
    <!-- 3D Mascot Gradient -->
    <radialGradient id="mascotShade" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FAF0FC" />
      <stop offset="65%" stop-color="#F0D5F8" />
      <stop offset="100%" stop-color="#DFC0EA" />
    </radialGradient>

    <!-- Golden Sparkle Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Voice Arc Gradient -->
    <linearGradient id="voiceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle Badge Base -->
  <rect x="6" y="6" width="112" height="112" rx="30" fill="#FFFFFF" stroke="#18181B" stroke-width="4.5" filter="url(#logoShadow)" />

  <!-- Background Accent Halo -->
  <circle cx="64" cy="68" r="42" fill="#F3F4F6" />

  <!-- Acoustic Voice Pulse Rings (Left & Right) -->
  <path d="M 18 64 C 18 52 23 44 30 38" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M 110 64 C 110 52 105 44 98 38" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Main Mascot Circle Face -->
  <circle cx="64" cy="70" r="36" fill="url(#mascotShade)" stroke="#18181B" stroke-width="4.2" />

  <!-- Mascot Highlights -->
  <path d="M 44 50 Q 64 42 84 50" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Cheerful Eyes with Multi-Gleam -->
  <!-- Left Eye -->
  <g>
    <ellipse cx="51" cy="67" rx="5.2" ry="6" fill="#18181B" />
    <circle cx="49" cy="64.5" r="2.2" fill="#FFFFFF" />
    <circle cx="53.5" cy="69" r="1.1" fill="#FFFFFF" />
  </g>

  <!-- Right Eye -->
  <g>
    <ellipse cx="77" cy="67" rx="5.2" ry="6" fill="#18181B" />
    <circle cx="75" cy="64.5" r="2.2" fill="#FFFFFF" />
    <circle cx="79.5" cy="69" r="1.1" fill="#FFFFFF" />
  </g>

  <!-- Rosy Blush Cheeks -->
  <ellipse cx="41" cy="74.5" rx="5" ry="3" fill="#F472B6" opacity="0.55" />
  <ellipse cx="87" cy="74.5" rx="5" ry="3" fill="#F472B6" opacity="0.55" />

  <!-- Happy Smile with Tongue Accent -->
  <path d="M 54 78 Q 64 88 74 78" stroke="#18181B" stroke-width="3.8" stroke-linecap="round" fill="none" />
  <path d="M 60 83 Q 64 87 68 83" fill="#F43F5E" opacity="0.85" />

  <!-- Scholar / AI Graduation Cap (Top-Right Angle) -->
  <g transform="translate(64, 38) rotate(-7)">
    <!-- Cap Rhombus Top -->
    <polygon points="0,-18 32,-7 0,4 -32,-7" fill="#18181B" stroke="#18181B" stroke-width="2" stroke-linejoin="round" />
    <!-- Cap Under Skullcap -->
    <path d="M -16,-4 Q 0,8 16,-4 L 16,3 Q 0,14 -16,3 Z" fill="#27272A" stroke="#18181B" stroke-width="1.8" />
    <!-- Tassel Ribbon -->
    <path d="M 0,-7 Q 18,-6 26,11" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" fill="none" />
    <circle cx="26" cy="12" r="3.2" fill="#FDE047" stroke="#18181B" stroke-width="1.6" />
    <!-- Golden Diamond Button on top -->
    <polygon points="0,-9 2.5,-7 0,-5 -2.5,-7" fill="#FDE047" />
  </g>

  <!-- AI Sparkle Star (Top Right Floating) -->
  <g transform="translate(100, 22)">
    <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="url(#goldGrad)" stroke="#18181B" stroke-width="1.8" stroke-linejoin="round" />
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
  </g>

  <!-- Small Science Orbit Dot (Bottom Left) -->
  <circle cx="23" cy="88" r="4.5" fill="#A7F3D0" stroke="#18181B" stroke-width="2" />
</svg>
